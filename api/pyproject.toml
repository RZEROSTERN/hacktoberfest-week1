[project]
name = "paperwork-api"
version = "1.0.0"
description = "Paperwork Translator API: explains documents in plain Spanish using Gemma 4 via Ollama"
requires-python = ">=3.12"
dependencies = [
    "av<17",
    "fastapi[standard]>=0.142.2",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.47",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: hits the real Ollama model (deselected by default)"]
addopts = "-m 'not integration'"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true
